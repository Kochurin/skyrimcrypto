# K3 — база данных метаданных (PostgreSQL), K4 — хранилище блобов (MinIO, S3-совместимое).
# Разработка: docker compose up -d                       (только db и minio; API и сайт — npm run dev)
# Продакшен:  docker compose --profile prod up -d --build (ещё api и web: Caddy с HTTPS, этап 5)
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-notepad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
      POSTGRES_DB: ${POSTGRES_DB:-notepad}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  minio:
    # Официальный образ minio/minio удалён с Docker Hub; это тот же MinIO в архивной сборке Bitnami.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-notepad}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-local-minio}
      MINIO_DEFAULT_BUCKETS: ${S3_BUCKET:-notes}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      retries: 10

  # ---------- Продакшен (профиль prod) ----------

  api:
    profiles: [prod]
    build: { context: ., target: api }
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      minio: { condition: service_healthy }
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8787
      DATABASE_URL: postgres://${POSTGRES_USER:-notepad}:${POSTGRES_PASSWORD:-change-me-local}@db:5432/${POSTGRES_DB:-notepad}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-notes}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-notepad}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-me-local-minio}
      # Без JWT_SECRET сервер не стартует в продакшене (см. config.ts)
      JWT_SECRET: ${JWT_SECRET:?Задайте JWT_SECRET в .env}
      COOKIE_SECURE: "true"
      TRUST_PROXY_HOPS: 1
      NODE_ENV: production
    # Порт наружу не открыт: к API обращается только Caddy

  web:
    profiles: [prod]
    build: { context: ., target: web }
    restart: unless-stopped
    depends_on: [api]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-skyrimcrypto.localhost}
      HTTP_PORT: ${HTTP_PORT:-8080}
      HTTPS_PORT: ${HTTPS_PORT:-8443}
    ports:
      - "${HTTP_PORT:-8080}:${HTTP_PORT:-8080}"
      - "${HTTPS_PORT:-8443}:${HTTPS_PORT:-8443}"
    volumes:
      - caddy-data:/data

volumes:
  db-data:
  minio-data:
  caddy-data:
