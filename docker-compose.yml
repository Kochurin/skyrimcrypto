# K3 — база данных метаданных (PostgreSQL), K4 — хранилище блобов (MinIO, S3-совместимое).
# Запуск: docker compose up -d   (нужен Docker Desktop; используется с этапа 2)
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-notepad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
      POSTGRES_DB: ${POSTGRES_DB:-notepad}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  minio:
    # Официальный образ minio/minio удалён с Docker Hub; это тот же MinIO в архивной сборке Bitnami.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-notepad}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-local-minio}
      MINIO_DEFAULT_BUCKETS: ${S3_BUCKET:-notes}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      retries: 10

volumes:
  db-data:
  minio-data:
